research:
  short-term:
    chip:
      enabled: true
      lookback-bars: 120
      price-buckets: 150
      display-buckets: 60
      max-concentration-zones: 3
      min-peak-relative-height: 0.20
      zone-edge-relative-height: 0.25
      min-valid-bars: 80
      min-turnover-coverage: 0.95
      weight: 0.25
      activation-mode: SHADOW
      single-source-coefficient: 1.00
      max-average-cost-deviation: 0.03
      min-cost-band-overlap: 0.70
      max-winner-rate-deviation: 0.10
      tushare:
        enabled: false
        base-url: https://api.tushare.pro
        token: ${TUSHARE_TOKEN:}
        connect-timeout-ms: 1200
        read-timeout-ms: 1800
        max-concurrency: 4
  ai:
    llm:
      provider: deepseek
      api-key: ${DEEPSEEK_API_KEY:}
      api-key-env: DEEPSEEK_API_KEY
      model: deepseek-v4-pro
      base-url: https://api.deepseek.com
      response-format: json_object
      strict-json-schema: false
      max-completion-tokens: 8192
  live-data:
    stock-limit: 80
    eastmoney-fund-flow-url: https://push2.eastmoney.com/api/qt/ulist.np/get
    eastmoney-fund-flow-minute-url: https://push2.eastmoney.com/api/qt/stock/fflow/kline/get
    eastmoney-quote-url: https://push2.eastmoney.com/api/qt/clist/get
    eastmoney-financial-url: https://datacenter-web.eastmoney.com/api/data/v1/get
    cninfo-announcement-url: https://www.cninfo.com.cn/new/hisAnnouncement/query
    gov-policy-url: https://www.gov.cn/zhengce/zuixin/ZUIXINZHENGCE.json
    fast-company-list: true
    filing-limit: 12
    filing-pdf-parse-limit: 2
    filing-pdf-max-pages: 6
    policy-sources:
      - name: 中国政府网
        type: json
        url: https://www.gov.cn/zhengce/zuixin/ZUIXINZHENGCE.json
        weight: 100
      - name: 国家发展改革委
        type: html
        url: https://www.ndrc.gov.cn/xxgk/zcfb/ghwb/
        weight: 92
      - name: 工业和信息化部
        type: html
        url: https://www.miit.gov.cn/zwgk/zcwj/
        weight: 90
      - name: 科学技术部
        type: html
        url: https://www.most.gov.cn/xxgk/xinxifenlei/fdzdgknr/fgzc/gfxwj/
        weight: 86
      - name: 财政部
        type: html
        url: https://www.mof.gov.cn/zhengwuxinxi/caizhengxinwen/
        weight: 82
      - name: 国家能源局
        type: html
        url: https://www.nea.gov.cn/zcfb/
        weight: 84
      - name: 中国证监会
        type: html
        url: https://www.csrc.gov.cn/csrc/c100028/zfxxgk_zdgk.shtml
        weight: 80
      - name: 生态环境部
        type: html
        url: https://www.mee.gov.cn/xxgk/
        weight: 84
      - name: 农业农村部
        type: html
        url: https://www.moa.gov.cn/govpublic/
        weight: 82
      - name: 交通运输部
