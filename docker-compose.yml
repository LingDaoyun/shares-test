services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-stock-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 19080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-nacos}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-host.docker.internal:8848}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_GROUP: ${NACOS_GROUP:-AI_STOCK}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      APP_ENV: ${APP_ENV:-local}
      SPRING_CLOUD_NACOS_DISCOVERY_FAIL_FAST: "false"
      JDBC_DATABASE_URL: ${JDBC_DATABASE_URL:-jdbc:h2:file:/data/aistock;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
      JDBC_DATABASE_DRIVER: ${JDBC_DATABASE_DRIVER:-org.h2.Driver}
      JDBC_DATABASE_USERNAME: ${JDBC_DATABASE_USERNAME:-sa}
      JDBC_DATABASE_PASSWORD: ${JDBC_DATABASE_PASSWORD:-}
    ports:
      - "${API_PORT:-19080}:19080"
    volumes:
      - api-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web-react/Dockerfile
    container_name: ai-stock-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5176}:80"
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-stock-postgres
    profiles: ["infra"]
    environment:
      POSTGRES_DB: aistock
      POSTGRES_USER: aistock
      POSTGRES_PASSWORD: aistock
    ports:
      - "5432:5432"
    volumes:
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aistock -d aistock"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-stock-redis
    profiles: ["infra"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ai-stock-minio
    profiles: ["infra"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: ai-stock-nacos
    profiles: ["infra"]
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/actuator/health | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  api-data:
  postgres-data:
  redis-data:
  minio-data:
  nacos-data:
