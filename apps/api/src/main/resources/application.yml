spring:
  application:
    name: ai-stock-api
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:h2:mem:aistock;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${JDBC_DATABASE_DRIVER:org.h2.Driver}
    username: ${JDBC_DATABASE_USERNAME:sa}
    password: ${JDBC_DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 19080

research:
  short-term:
    scan-job-timeout: PT15M
    validation:
      enabled: true
      outcome-cron: "0 30 16 * * MON-FRI"
      batch-size: 100
      minimum-cohort-samples: 30
      buy-commission-percent: 0.03
      sell-commission-percent: 0.03
      sell-stamp-duty-percent: 0.05
      buy-slippage-percent: 0.05
      sell-slippage-percent: 0.05
    chip:
      enabled: true
      lookback-bars: 120
      price-buckets: 150
      display-buckets: 60
      max-concentration-zones: 3
      min-peak-relative-height: 0.20
      zone-edge-relative-height: 0.25
      min-valid-bars: 80
      min-turnover-coverage: 0.95
      weight: 0.25
      activation-mode: SHADOW
      single-source-coefficient: 1.00
      max-average-cost-deviation: 0.03
      min-cost-band-overlap: 0.70
      max-winner-rate-deviation: 0.10
      tushare:
        enabled: false
        base-url: https://api.tushare.pro
        token: ${TUSHARE_TOKEN:}
        connect-timeout-ms: 1200
        read-timeout-ms: 1800
        max-concurrency: 4
  ai:
    llm:
      provider: ${LLM_PROVIDER:deepseek}
      api-key: ${LLM_API_KEY:}
      api-key-env: ${LLM_API_KEY_ENV:}
      model: ${LLM_MODEL:}
      base-url: ${LLM_BASE_URL:}
      response-format: ${LLM_RESPONSE_FORMAT:}
      strict-json-schema: ${LLM_STRICT_JSON_SCHEMA:false}
      thinking: ${LLM_THINKING:}
  live-data:
    stock-limit: 80
    eastmoney-fund-flow-url: https://push2.eastmoney.com/api/qt/ulist.np/get
    eastmoney-fund-flow-minute-url: https://push2.eastmoney.com/api/qt/stock/fflow/kline/get
    eastmoney-quote-url: https://push2.eastmoney.com/api/qt/clist/get
    eastmoney-financial-url: https://datacenter-web.eastmoney.com/api/data/v1/get
    cninfo-announcement-url: https://www.cninfo.com.cn/new/hisAnnouncement/query
    gov-policy-url: https://www.gov.cn/zhengce/zuixin/ZUIXINZHENGCE.json
    fast-company-list: true
    filing-limit: 12
    filing-pdf-parse-limit: 2
    filing-pdf-max-pages: 6
