spring:
  application:
    name: ai-stock-api
  profiles:
    default: nacos
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        enabled: false
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:h2:mem:aistock;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${JDBC_DATABASE_DRIVER:org.h2.Driver}
    username: ${JDBC_DATABASE_USERNAME:sa}
    password: ${JDBC_DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 19080

research:
  ai:
    llm:
      provider: ${LLM_PROVIDER:deepseek}
      api-key: ${LLM_API_KEY:}
      api-key-env: ${LLM_API_KEY_ENV:}
      model: ${LLM_MODEL:}
      base-url: ${LLM_BASE_URL:}
      response-format: ${LLM_RESPONSE_FORMAT:}
      strict-json-schema: ${LLM_STRICT_JSON_SCHEMA:false}
      thinking: ${LLM_THINKING:}
  live-data:
    stock-limit: 80
    eastmoney-fund-flow-url: https://push2.eastmoney.com/api/qt/ulist.np/get
    eastmoney-fund-flow-minute-url: https://push2.eastmoney.com/api/qt/stock/fflow/kline/get
    eastmoney-quote-url: https://push2.eastmoney.com/api/qt/clist/get
    eastmoney-financial-url: https://datacenter-web.eastmoney.com/api/data/v1/get
    cninfo-announcement-url: https://www.cninfo.com.cn/new/hisAnnouncement/query
    gov-policy-url: https://www.gov.cn/zhengce/zuixin/ZUIXINZHENGCE.json
    fast-company-list: true
    filing-limit: 12
    filing-pdf-parse-limit: 2
    filing-pdf-max-pages: 6
    policy-sources:
      - name: 中国政府网
        type: json
        url: https://www.gov.cn/zhengce/zuixin/ZUIXINZHENGCE.json
        weight: 100
      - name: 国家发展改革委
        type: html
        url: https://www.ndrc.gov.cn/xxgk/zcfb/ghwb/
        weight: 92
      - name: 工业和信息化部
        type: html
        url: https://www.miit.gov.cn/zwgk/zcwj/
        weight: 90
      - name: 科学技术部
        type: html
        url: https://www.most.gov.cn/xxgk/xinxifenlei/fdzdgknr/fgzc/gfxwj/
        weight: 86
      - name: 财政部
        type: html
        url: https://www.mof.gov.cn/zhengwuxinxi/caizhengxinwen/
        weight: 82
      - name: 国家能源局
        type: html
        url: https://www.nea.gov.cn/zcfb/
        weight: 84
      - name: 中国证监会
        type: html
        url: https://www.csrc.gov.cn/csrc/c100028/zfxxgk_zdgk.shtml
        weight: 80
      - name: 生态环境部
        type: html
        url: https://www.mee.gov.cn/xxgk/
        weight: 84
      - name: 农业农村部
        type: html
        url: https://www.moa.gov.cn/govpublic/
        weight: 82
      - name: 交通运输部
        type: html
        url: https://xxgk.mot.gov.cn/zhengceapp/740/833/list_7234.html
        weight: 82
